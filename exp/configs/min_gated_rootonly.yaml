# MIN M3 ablation -M5 (root only) on full_gated: single generation, no revision loop (also what `-M5` means in E3). Roots are the same prompts as
# full_gated's, so they are cache hits when the cache of the full_gated r0 run is imported first. TEMPLATE -> frozen/gated_rootonly.yaml. --system full_gated.
temperature: 0.0
ddl: {quote_keywords: true}
m5: {policy: gated, enabled: false, route_human: false, gate_empty: false, score_for_routing: false, t_max: 3}
route: {score: exec, theta_h: 7.5}
